name: Docker

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect develop/main tip
        id: tips
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git fetch origin develop:refs/remotes/origin/develop || true
          git fetch origin main:refs/remotes/origin/main || true
          for b in develop main; do
            if git rev-parse "origin/${b}" >/dev/null 2>&1 \
              && [ "$(git rev-parse "origin/${b}")" = "${sha}" ]; then
              echo "${b}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${b}=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=branch
            type=raw,value=develop,enable=${{ github.ref_type == 'tag' && steps.tips.outputs.develop == 'true' }}
            type=raw,value=main,enable=${{ github.ref_type == 'tag' && steps.tips.outputs.main == 'true' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_TAG=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.event_name == 'pull_request' && github.head_ref || (github.ref_type == 'branch' && github.ref_name || '') }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
